; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Select one module by changing default_envs below:
; - esp32-s3-wroom-1-n8r2  (8MB Flash, 2MB PSRAM)
; - esp32-s3-wroom-1-n16r8 (16MB Flash, 8MB PSRAM)
default_envs = esp32-s3-wroom-1-n16r8
; default_envs = esp32-s3-wroom-1-n8r2

[env]
platform = espressif32
framework = espidf
upload_port = COM2
monitor_port = COM2
monitor_speed = 115200

[env:esp32-s3-wroom-1-n8r2]
board = esp32-s3-wroom-1-n8r2
build_flags =
	-DUSER_CONFIG_BOARD_N8R2

[env:esp32-s3-wroom-1-n16r8]
board = esp32-s3-wroom-1-n16r8
build_flags =
	-DUSER_CONFIG_BOARD_N16R8
