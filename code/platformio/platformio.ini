; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Select one module by changing default_envs below:
; - esp32-s3-wroom-1-n8r2  (8MB Flash, 2MB PSRAM)
; - esp32-s3-wroom-1-n16r8 (16MB Flash, 8MB PSRAM)
default_envs = esp32-s3-wroom-1-n16r8
; default_envs = esp32-s3-wroom-1-n8r2
data_dir = lib/assets

[env]
platform = espressif32
framework = espidf
upload_port = COM2
monitor_port = COM2
monitor_speed = 115200
board_build.filesystem = spiffs
extra_scripts =
	pre:scripts/check_no_typedef_in_c.py

[env:esp32-s3-wroom-1-n8r2]
board = esp32-s3-wroom-1-n8r2
board_build.partitions = partitions_n8r2.csv
build_flags =
	-DUSER_CONFIG_BOARD_N8R2
	-fno-ira-loop-pressure

[env:esp32-s3-wroom-1-n16r8]
board = esp32-s3-wroom-1-n16r8
board_build.partitions = partitions_n16r8.csv
build_flags =
	-DUSER_CONFIG_BOARD_N16R8
	-fno-ira-loop-pressure
